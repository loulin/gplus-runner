name: macOS Desktop Release

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to publish
        required: true
        default: gplus-bot-desktop
        type: choice
        options: [gplus-bot-desktop, libre-reader]
      profile:
        description: Release profile
        required: true
        default: staging
        type: choice
        options: [staging, production]
      tag:
        description: Canonical annotated release tag in loulin/gplus
        required: true
        type: string
      target:
        description: One macOS target
        required: true
        default: mac-arm64
        type: choice
        options: [mac-arm64, mac-x64]

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ inputs.application }}-${{ inputs.profile }}-${{ inputs.target }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish macOS Desktop release
    runs-on: ${{ inputs.target == 'mac-arm64' && 'macos-15' || 'macos-15-intel' }}
    environment: ${{ inputs.profile }}
    timeout-minutes: 360
    env:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      APPLICATION: ${{ inputs.application }}
      PROFILE: ${{ inputs.profile }}
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GPLUS_SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.GPLUS_SOURCE_READER_PRIVATE_KEY }}
          owner: loulin
          repositories: gplus
          permission-contents: read

      - name: Checkout private source at release tag
        id: source-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loulin/gplus
          ref: ${{ inputs.tag }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          fetch-depth: 0
          # Initialize the Gplus-only Hermes submodule in a separate retrying
          # step below; Libre Reader does not consume it.
          submodules: false
          # release:local performs authenticated ls-remote calls while it
          # revalidates the annotated release identity.
          persist-credentials: true

      - name: Initialize Hermes submodule from locked tag
        if: inputs.application == 'gplus-bot-desktop'
        working-directory: source
        shell: bash
        env:
          HERMES_SOURCE_SSH_KEY: ${{ secrets.HERMES_SOURCE_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${HERMES_SOURCE_SSH_KEY:?HERMES_SOURCE_SSH_KEY is required}"
          export GIT_TERMINAL_PROMPT=0
          hermes_path='apps/gplus-bot-desktop/vendor/hermes-agent'
          hermes_checkout="$PWD/$hermes_path"
          hermes_url="$(git config --file .gitmodules --get "submodule.$hermes_path.url")"
          hermes_ssh_url='git@github.com:NousResearch/hermes-agent.git'
          hermes_tag="$(jq -er '.upstream.tag' apps/gplus-bot-desktop/vendor/hermes-source-lock.json)"
          expected_hermes_commit="$(git rev-parse "HEAD:$hermes_path")"
          expected_hermes_tag_object="$(jq -er '.upstream.tagObject' apps/gplus-bot-desktop/vendor/hermes-source-lock.json)"
          if [[ "$hermes_url" != 'https://github.com/NousResearch/hermes-agent.git' ]]; then
            echo "Unexpected Hermes submodule URL: $hermes_url" >&2
            exit 1
          fi
          if [[ ! "$hermes_tag" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Invalid Hermes source tag in source lock: $hermes_tag" >&2
            exit 1
          fi
          if [[ ! "$expected_hermes_commit" =~ ^[0-9a-f]{40}$ || ! "$expected_hermes_tag_object" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Hermes source identity in release commit" >&2
            exit 1
          fi
          git submodule sync --recursive
          ssh_dir="$RUNNER_TEMP/gplus-hermes-ssh"
          ssh_key_path="$ssh_dir/id_ed25519"
          known_hosts_path="$ssh_dir/known_hosts"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$HERMES_SOURCE_SSH_KEY" > "$ssh_key_path"
          chmod 600 "$ssh_key_path"
          ssh-keyscan -T 30 -p 443 -t ed25519 ssh.github.com > "$known_hosts_path" 2>/dev/null
          test -s "$known_hosts_path"
          host_fingerprint="$(ssh-keygen -lf "$known_hosts_path" | awk 'NR == 1 { print $2 }')"
          if [[ "$host_fingerprint" != 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' ]]; then
            echo "Unexpected ssh.github.com host key fingerprint: $host_fingerprint" >&2
            exit 1
          fi
          git_ssh_command="ssh -i $ssh_key_path -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path -o HostName=ssh.github.com -p 443"
          export GIT_SSH_COMMAND="$git_ssh_command"
          printf 'GIT_SSH_COMMAND=%s\n' "$git_ssh_command" >> "$GITHUB_ENV"
          git config --local \
            url."$hermes_ssh_url".insteadOf \
            "$hermes_url"
          git_with_github_ssh() {
            GIT_CONFIG_GLOBAL=/dev/null git \
              -c protocol.version=2 \
              "$@"
          }
          for attempt in 1 2 3 4 5; do
            if [[ -e "$hermes_checkout" ]]; then
              rm -rf -- "$hermes_checkout"
            fi
            if mkdir -p "$(dirname "$hermes_checkout")" \
              && git init --quiet "$hermes_checkout" \
              && git -C "$hermes_checkout" remote add origin "$hermes_ssh_url" \
              && git_with_github_ssh -C "$hermes_checkout" fetch \
                --no-tags --depth 1 --filter=blob:none origin \
                "refs/tags/$hermes_tag:refs/tags/$hermes_tag" \
              && git -C "$hermes_checkout" checkout --quiet --detach "$expected_hermes_commit"; then
              actual_hermes_commit="$(git -C "$hermes_path" rev-parse HEAD)"
              if [[ "$actual_hermes_commit" != "$expected_hermes_commit" ]]; then
                echo "Hermes gitlink mismatch: expected $expected_hermes_commit, got $actual_hermes_commit" >&2
                exit 1
              fi
              actual_hermes_tag_object="$(git -C "$hermes_path" rev-parse "refs/tags/$hermes_tag^{tag}")"
              actual_hermes_tag_commit="$(git -C "$hermes_path" rev-parse "refs/tags/$hermes_tag^{commit}")"
              if [[ "$actual_hermes_tag_object" != "$expected_hermes_tag_object" || "$actual_hermes_tag_commit" != "$expected_hermes_commit" ]]; then
                echo "Hermes tag identity mismatch: expected $expected_hermes_tag_object/$expected_hermes_commit, got $actual_hermes_tag_object/$actual_hermes_tag_commit" >&2
                exit 1
              fi
              if [[ -n "$(git -C "$hermes_path" status --porcelain --untracked-files=all)" ]]; then
                echo 'Hermes checkout is dirty after initialization' >&2
                exit 1
              fi
              git submodule init -- "$hermes_path"
              # release:local creates another worktree. Point its temporary
              # submodule clone at this verified checkout to avoid a second
              # public GitHub fetch during release preparation.
              git config --local "submodule.$hermes_path.url" "$hermes_checkout"
              git config --local "submodule.$hermes_path.active" true
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Hermes submodule initialization failed after 5 attempts' >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Hermes submodule initialization failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ inputs.target == 'mac-arm64' && 'arm64' || 'x64' }}

      - name: Setup packaging Python
        if: inputs.application == 'gplus-bot-desktop'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ inputs.target == 'mac-arm64' && 'arm64' || 'x64' }}

      - name: Pin packaging Python runtime
        if: inputs.application == 'gplus-bot-desktop'
        shell: bash
        run: |
          set -euo pipefail
          packaging_python="$(python3 -c 'import sys; print(sys.executable)')"
          packaging_version="$("$packaging_python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          case "$packaging_version" in
            3.11.*|3.12.*|3.13.*)
              ;;
            *)
              echo "Unsupported packaging Python version: $packaging_version" >&2
              exit 1
              ;;
          esac
          expected_machine='${{ inputs.target == 'mac-arm64' && 'arm64' || 'x86_64' }}'
          actual_machine="$("$packaging_python" -c 'import platform; print(platform.machine())')"
          if [[ "$actual_machine" != "$expected_machine" ]]; then
            echo "Target $TARGET requires packaging Python machine $expected_machine, got $actual_machine" >&2
            exit 1
          fi
          printf 'GPLUS_OFFLINE_PYTHON=%s\n' "$packaging_python" >> "$GITHUB_ENV"
          echo "Pinned packaging Python $packaging_version ($actual_machine)"

      - name: Setup uv
        if: inputs.application == 'gplus-bot-desktop'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Setup Fastlane Ruby
        if: inputs.application == 'gplus-bot-desktop'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler: '2.7.2'
          bundler-cache: false

      - name: Validate runner architecture and release provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            mac-arm64)
              expected_host_arch='arm64'
              expected_node_arch='arm64'
              ;;
            mac-x64)
              expected_host_arch='x86_64'
              expected_node_arch='x64'
              ;;
            *)
              echo "Unsupported macOS target: $TARGET" >&2
              exit 2
              ;;
          esac
          actual_host_arch="$(uname -m)"
          actual_node_arch="$(node -p 'process.arch')"
          if [[ "$actual_host_arch" != "$expected_host_arch" || "$actual_node_arch" != "$expected_node_arch" ]]; then
            echo "Target $TARGET requires host/node $expected_host_arch/$expected_node_arch, got $actual_host_arch/$actual_node_arch" >&2
            exit 1
          fi

          node scripts/validate-macos-desktop-source.mjs \
            --application "$APPLICATION" \
            --profile "$PROFILE" \
            --source-dir source \
            --tag "$TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure build caches
        shell: bash
        run: |
          set -euo pipefail
          npm_cache="$RUNNER_TEMP/gplus-npm-cache"
          uv_cache="$RUNNER_TEMP/gplus-uv-cache"
          electron_cache="$RUNNER_TEMP/gplus-electron-cache"
          builder_cache="$RUNNER_TEMP/gplus-electron-builder-cache"
          {
            printf 'NPM_CONFIG_CACHE=%s\n' "$npm_cache"
            printf 'UV_CACHE_DIR=%s\n' "$uv_cache"
            printf 'electron_config_cache=%s\n' "$electron_cache"
            printf 'ELECTRON_BUILDER_CACHE=%s\n' "$builder_cache"
            printf 'NPM_CONFIG_AUDIT=false\n'
            printf 'NPM_CONFIG_FUND=false\n'
            printf 'NPM_CONFIG_PREFER_OFFLINE=true\n'
          } >> "$GITHUB_ENV"

      - name: Restore npm download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-npm-cache
          key: gplus-runner-npm-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/gplus-bot-desktop/src/overlay/package-rewrite.mjs', 'source/apps/libre-reader/pnpm-lock.yaml') }}
          restore-keys: |
            gplus-runner-npm-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-
            gplus-runner-npm-${{ runner.os }}-${{ inputs.target }}-

      - name: Restore uv download cache
        if: inputs.application == 'gplus-bot-desktop'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-uv-cache
          key: gplus-runner-uv-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/gplus-bot-desktop/src/overlay/python-dependency-profile.mjs', 'source/apps/gplus-bot-desktop/vendor/hermes-agent/pyproject.toml', 'source/apps/gplus-bot-desktop/vendor/hermes-agent/uv.lock') }}
          restore-keys: |
            gplus-runner-uv-${{ runner.os }}-${{ inputs.target }}-
            gplus-runner-uv-${{ runner.os }}-

      - name: Restore Electron download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-electron-cache
          key: gplus-runner-electron-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/libre-reader/package.json') }}
          restore-keys: |
            gplus-runner-electron-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-
            gplus-runner-electron-${{ runner.os }}-${{ inputs.target }}-

      - name: Restore Electron Builder tool cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-electron-builder-cache
          key: gplus-runner-electron-builder-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/libre-reader/package.json') }}
          restore-keys: |
            gplus-runner-electron-builder-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-
            gplus-runner-electron-builder-${{ runner.os }}-${{ inputs.target }}-

      - name: Install filtered dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if [[ "$APPLICATION" == 'gplus-bot-desktop' ]]; then
            corepack pnpm install --filter 'gplus-bot-desktop...' --recursive --frozen-lockfile --ignore-scripts --prefer-offline
            corepack pnpm --filter '@gplus/bot-contracts' run build
          else
            corepack pnpm install --filter 'libre-reader...' --recursive --frozen-lockfile --ignore-scripts --prefer-offline
          fi

      - name: Prepare qshell
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          qshell_dir="$RUNNER_TEMP/gplus-qshell-bin"
          export QSHELL_INSTALL_DIR="$qshell_dir"
          source scripts/prepare_qshell.sh
          qiniu_prepare_qshell
          qshell_path="$(command -v qshell)"
          test -x "$qshell_path"
          {
            printf 'QSHELL_INSTALL_DIR=%s\n' "$qshell_dir"
            printf 'QSHELL=%s\n' "$qshell_path"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$qshell_dir" >> "$GITHUB_PATH"

      - name: Prepare macOS signing credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          MAC_DEVELOPER_ID_P12_B64: ${{ secrets.MAC_DEVELOPER_ID_P12_B64 }}
        run: |
          set -euo pipefail
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is required}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is required}"
          : "${ASC_KEY_P8_B64:?ASC_KEY_P8_B64 is required}"
          : "${MAC_DEVELOPER_ID_P12_B64:?MAC_DEVELOPER_ID_P12_B64 is required}"
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo 'ASC_KEY_ID contains unsupported path characters' >&2
            exit 1
          fi
          credential_dir="$RUNNER_TEMP/gplus-macos-release-credentials"
          mkdir -p "$credential_dir"
          chmod 700 "$credential_dir"
          asc_key_path="$credential_dir/AuthKey_${ASC_KEY_ID}.p8"
          p12_path="$credential_dir/developer-id-application.p12"
          decode_base64() {
            if base64 --decode </dev/null >/dev/null 2>&1; then
              base64 --decode
            else
              base64 -D
            fi
          }
          printf '%s' "$ASC_KEY_P8_B64" | decode_base64 > "$asc_key_path"
          printf '%s' "$MAC_DEVELOPER_ID_P12_B64" | decode_base64 > "$p12_path"
          chmod 600 "$asc_key_path" "$p12_path"
          test -s "$asc_key_path"
          test -s "$p12_path"
          openssl pkey -in "$asc_key_path" -noout
          {
            printf 'ASC_KEY_PATH=%s\n' "$asc_key_path"
            printf 'MAC_DEVELOPER_ID_P12_PATH=%s\n' "$p12_path"
            printf 'APPLE_API_KEY=%s\n' "$asc_key_path"
            printf 'APPLE_API_KEY_PATH=%s\n' "$asc_key_path"
            printf 'APPLE_API_KEY_ID=%s\n' "$ASC_KEY_ID"
            printf 'APPLE_API_ISSUER=%s\n' "$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Publish signed and notarized release
        working-directory: source
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          MAC_DEVELOPER_ID_SHA1: ${{ secrets.MAC_DEVELOPER_ID_SHA1 }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is required}"
          : "${ASC_KEY_ID:?ASC_KEY_ID is required}"
          : "${ASC_KEY_PATH:?ASC_KEY_PATH is required}"
          : "${MAC_DEVELOPER_ID_P12_PASSWORD:?MAC_DEVELOPER_ID_P12_PASSWORD is required}"
          : "${MAC_DEVELOPER_ID_P12_PATH:?MAC_DEVELOPER_ID_P12_PATH is required}"
          : "${MAC_DEVELOPER_ID_SHA1:?MAC_DEVELOPER_ID_SHA1 is required}"
          : "${QINIU_ACCESS_KEY:?QINIU_ACCESS_KEY is required}"
          : "${QINIU_SECRET_KEY:?QINIU_SECRET_KEY is required}"
          : "${RELEASE_TOKEN:?RELEASE_TOKEN is required}"
          openssl pkcs12 -in "$MAC_DEVELOPER_ID_P12_PATH" \
            -passin env:MAC_DEVELOPER_ID_P12_PASSWORD -noout
          if [[ "$APPLICATION" == 'gplus-bot-desktop' ]]; then
            export GPLUS_DESKTOP_CREDENTIALS_ACTIVE=1
            npm --prefix apps/gplus-bot-desktop run release:local -- \
              --tag "$TAG" \
              --target "$TARGET" \
              --provider qiniu
          else
            export LIBRE_RELEASE_CREDENTIALS_ACTIVE=1
            corepack pnpm --filter libre-reader run release:local -- \
              --profile "$PROFILE" \
              --version "${{ steps.source.outputs.version }}" \
              --target "$TARGET"
          fi

      - name: Write release summary
        if: success()
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TAG_OBJECT_ID: ${{ steps.source.outputs.tag_object_id }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '### macOS Desktop release'
            printf '\n%s\n' "- Application/profile: $APPLICATION / $PROFILE"
            printf '%s\n' "- Target: $TARGET"
            printf '%s\n' "- Tag: $TAG"
            printf '%s\n' "- Tag object: $TAG_OBJECT_ID"
            printf '%s\n' "- Source: $SOURCE_SHA ($SOURCE_REF)"
            printf '%s\n' "- Version/build: $VERSION / $BUILD_NUMBER"
            printf '%s\n' '- Result: signed, notarized, uploaded to Qiniu, and registered with Release API'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save npm download cache
        if: always() && steps.source-checkout.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-npm-cache
          key: gplus-runner-npm-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/gplus-bot-desktop/src/overlay/package-rewrite.mjs', 'source/apps/libre-reader/pnpm-lock.yaml') }}

      - name: Save uv download cache
        if: always() && inputs.application == 'gplus-bot-desktop' && steps.source-checkout.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-uv-cache
          key: gplus-runner-uv-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/gplus-bot-desktop/src/overlay/python-dependency-profile.mjs', 'source/apps/gplus-bot-desktop/vendor/hermes-agent/pyproject.toml', 'source/apps/gplus-bot-desktop/vendor/hermes-agent/uv.lock') }}

      - name: Save Electron download cache
        if: always() && steps.source-checkout.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-electron-cache
          key: gplus-runner-electron-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/libre-reader/package.json') }}

      - name: Save Electron Builder tool cache
        if: always() && steps.source-checkout.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gplus-electron-builder-cache
          key: gplus-runner-electron-builder-${{ runner.os }}-${{ inputs.target }}-${{ inputs.application }}-${{ hashFiles('source/pnpm-lock.yaml', 'source/apps/gplus-bot-desktop/vendor/hermes-source-lock.json', 'source/apps/libre-reader/package.json') }}

      - name: Remove macOS release credentials and GitHub token
        if: always()
        shell: bash
        run: |
          set +e
          credential_dir="$RUNNER_TEMP/gplus-macos-release-credentials"
          ssh_dir="$RUNNER_TEMP/gplus-hermes-ssh"
          rm -f "$credential_dir/AuthKey_"*.p8 "$credential_dir/developer-id-application.p12"
          rmdir "$credential_dir" 2>/dev/null || true
          rm -f "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          rmdir "$ssh_dir" 2>/dev/null || true
          if [[ -d source/.git ]]; then
            git -C source config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git -C source submodule foreach --recursive \
              'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' \
              2>/dev/null || true
          fi
