name: macOS Mobile Build

# 移动端（Android + iOS）在 hosted macOS 上的**构建**入口。本仓库是 public，因此这里只构建、
# 不写入 loulin/gplus 的 Draft Release：本仓库持有的唯一仓库外凭据是只读的 Infisical 机器身份
# （构建签名与上传所需），没有任何对私有 monorepo 的写权限。
#
# 发布记录由 loulin/gplus 的 `record-mobile-runner-release.yml` 在本仓库构建成功后写回
# （触发者执行，见 docs/development/mobile/release-automation.md）。
#
# 编排与脚本仍只有一份：这里检出 loulin/gplus 的发布 Tag 后调用同一套 scripts/mobile。

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to publish
        required: true
        default: gplus-customer-app
        type: choice
        options: [gplus-customer-app, gplus-customer-pro-app, gplus-clinician-app]
      profile:
        description: Release profile
        required: true
        default: staging
        type: choice
        options: [staging, production]
      tag:
        description: Canonical annotated mobile release tag in loulin/gplus (mobile/<app>/vX.Y.Z)
        required: true
        type: string
      build_number:
        description: Build number from the Draft Release manifest (must match it)
        required: true
        type: string
      android_units:
        description: Android planned units from the Draft manifest, or "-" (e.g. direct|universal|arm64-v8a)
        required: true
        default: "-"
        type: string
      ios_units:
        description: iOS planned units from the Draft manifest, or "-" (e.g. store|app_store|arm64)
        required: true
        default: "-"
        type: string
      platforms:
        description: Which platforms to build and publish
        required: true
        default: all
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

concurrency:
  group: macos-mobile-${{ inputs.application }}-${{ inputs.profile }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate mobile release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # 每个平台跑在独立 job 里：mobile.sh 会改写 pubspec.yaml 的 build code，同一 checkout
      # 里连续跑两个平台会让第二个平台的工作区门禁（要求干净）失败。
      - name: Validate inputs and derive platform matrix
        id: matrix
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          PROFILE: ${{ inputs.profile }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ANDROID_UNITS: ${{ inputs.android_units }}
          IOS_UNITS: ${{ inputs.ios_units }}
        run: |
          set -euo pipefail
          case "$APPLICATION" in
            gplus-customer-app|gplus-customer-pro-app|gplus-clinician-app) ;;
            *) echo "unsupported application: $APPLICATION" >&2; exit 1 ;;
          esac
          case "$PLATFORMS" in
            all|android|ios) ;;
            *) echo "unsupported platforms: $PLATFORMS" >&2; exit 1 ;;
          esac
          # Android 生产签名需要 signing.keystore 二进制，本仓库的 Environment secrets 里没有，
          # 而 Infisical 只承载文本凭据。生产 Android 明确留给 loulin/gplus 的宿主运行面，
          # 在这里 fail fast 而不是构建出未签名的包。
          if [[ "$PROFILE" == 'production' && "$PLATFORMS" != 'ios' ]]; then
            echo "production Android signing is not available on this runner; use the loulin/gplus self-hosted runner" >&2
            exit 1
          fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "build_number must be a positive integer" >&2; exit 1; }
          unit_pattern='^(direct|store)\|[A-Za-z0-9][A-Za-z0-9_.-]*\|[A-Za-z0-9][A-Za-z0-9_.-]*$'
          for descriptor in ${ANDROID_UNITS//,/ } ${IOS_UNITS//,/ }; do
            [[ "$descriptor" == '-' ]] && continue
            [[ "$descriptor" =~ $unit_pattern ]] || { echo "invalid unit descriptor: $descriptor" >&2; exit 1; }
          done
          if [[ "$PLATFORMS" != 'ios' && "$ANDROID_UNITS" == '-' ]]; then
            echo "android_units is required when building Android" >&2; exit 1
          fi
          if [[ "$PLATFORMS" != 'android' && "$IOS_UNITS" == '-' ]]; then
            echo "ios_units is required when building iOS" >&2; exit 1
          fi
          case "$PLATFORMS" in
            all) platforms='["android","ios"]' ;;
            android) platforms='["android"]' ;;
            ios) platforms='["ios"]' ;;
          esac
          printf 'matrix={"platform":%s}\n' "$platforms" >> "$GITHUB_OUTPUT"
          echo "mobile release inputs ok: application=$APPLICATION profile=$PROFILE platforms=$PLATFORMS"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: macos-15
    environment: ${{ inputs.profile }}
    timeout-minutes: 240
    env:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      APPLICATION: ${{ inputs.application }}
      PROFILE: ${{ inputs.profile }}
      TAG: ${{ inputs.tag }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ANDROID_UNITS: ${{ inputs.android_units }}
      IOS_UNITS: ${{ inputs.ios_units }}
      FLUTTER_VERSION: '3.44.8'
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 源码 checkout 只需要 contents: read。本仓库不持有任何对 loulin/gplus 的写权限。
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GPLUS_SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.GPLUS_SOURCE_READER_PRIVATE_KEY }}
          owner: loulin
          repositories: gplus
          permission-contents: read

      - name: Checkout private source at release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loulin/gplus
          ref: ${{ inputs.tag }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          architecture: arm64

      # 本仓库没有 package.json，pnpm/action-setup 读不到版本；用 corepack 提供 pnpm shim
      # （与 release-macos-desktop.yml 一致），实际版本由被检出的 gplus packageManager 决定。
      - name: Enable Corepack pnpm
        run: corepack enable

      - name: Setup Ruby (fastlane)
        if: matrix.platform == 'ios'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler: '2.7.2'
          bundler-cache: false

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 只依据 Tag 自身与调用方传入的计划校验身份，不读 Draft Release（本仓库没有该权限，
      # 也不需要）。真正的 plan 一致性由 loulin/gplus 写回发布记录时对 Draft 校验。
      - name: Resolve release identity from the Tag
        id: resolve
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          if ! identity="$(node scripts/mobile/resolve-release-tag.mjs "$TAG")"; then
            echo "Invalid mobile release Tag: $TAG" >&2
            exit 1
          fi
          IFS=$'\t' read -r resolved_app _version _base_version env_name prerelease _github_env \
            <<< "$identity"

          if [[ "$resolved_app" != "$APPLICATION" ]]; then
            echo "Tag app ($resolved_app) does not match requested application ($APPLICATION)" >&2
            exit 1
          fi
          expected_env="$PROFILE"
          [[ "$expected_env" == 'production' ]] && expected_env='prod'
          if [[ "$env_name" != "$expected_env" ]]; then
            echo "Tag environment ($env_name) does not match profile ($PROFILE)" >&2
            exit 1
          fi

          source_sha="$(git rev-parse --verify HEAD^{commit})"
          [[ "$BUILD_NUMBER" == "$(sed -n 's/^version: [0-9.]*+\([0-9]*\)$/\1/p' "apps/$resolved_app/pubspec.yaml")" ]] \
            || echo "note: build_number input differs from the tagged pubspec; mobile.sh will assert it"

          {
            printf 'app=%s\n' "$resolved_app"
            printf 'env=%s\n' "$env_name"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'RESOLVED_APP=%s\n' "$resolved_app"
            printf 'RESOLVED_ENV=%s\n' "$env_name"
          } >> "$GITHUB_ENV"
          echo "resolved: app=$resolved_app env=$env_name sha=$source_sha build=$BUILD_NUMBER"

      - name: Install release record dependencies
        working-directory: source
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile --ignore-scripts --filter @gplus/release-records
          corepack pnpm --filter @gplus/release-records build

      - name: Run mobile platform
        id: build
        continue-on-error: true
        shell: bash
        working-directory: source
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          chmod +x scripts/mobile/mobile.sh scripts/mobile/android.sh scripts/mobile/ios.sh

          if [[ "$PLATFORM" == 'android' ]]; then
            ./scripts/mobile/mobile.sh android release \
              --app "$RESOLVED_APP" \
              --env "$RESOLVED_ENV" \
              --tag "$TAG" \
              --build-number "$BUILD_NUMBER" \
              --expected-release-units "$ANDROID_UNITS" \
              --result-file "apps/$RESOLVED_APP/build/release-results/$RESOLVED_ENV/android/mobile-release-result.json"
          else
            ios_env_file="$RUNNER_TEMP/mobile-release-${RESOLVED_APP}-${RESOLVED_ENV}.env"
            printf '%s\n' "IOS_EXPORT_OPTIONS_PLIST=build/ci/ExportOptions.plist" > "$ios_env_file"
            mkdir -p "apps/$RESOLVED_APP/build/ci"
            case "$RESOLVED_ENV" in
              prod) ios_template="apps/$RESOLVED_APP/ios/ExportOptions-appstore.plist" ;;
              *) ios_template="apps/$RESOLVED_APP/ios/ExportOptions-${RESOLVED_ENV}.plist" ;;
            esac
            [[ -f "$ios_template" ]] || { echo "Missing export options template: $ios_template" >&2; exit 1; }
            cp "$ios_template" "apps/$RESOLVED_APP/build/ci/ExportOptions.plist"

            ./scripts/mobile/mobile.sh ios release \
              --app "$RESOLVED_APP" \
              --env "$RESOLVED_ENV" \
              --env-file "$ios_env_file" \
              --tag "$TAG" \
              --build-number "$BUILD_NUMBER" \
              --expected-release-units "$IOS_UNITS" \
              --result-file "apps/$RESOLVED_APP/build/release-results/$RESOLVED_ENV/ios/mobile-release-result.json"
          fi

      - name: Upload mobile release results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-release-results-${{ inputs.application }}-${{ inputs.profile }}-${{ matrix.platform }}
          # 上传整个 <env> 目录，artifact 内保持 <platform>/mobile-release-result.json 结构。
          path: source/apps/${{ inputs.application }}/build/release-results/${{ steps.resolve.outputs.env }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mobile artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-artifacts-${{ inputs.application }}-${{ inputs.profile }}-${{ matrix.platform }}
          path: source/apps/${{ inputs.application }}/build/release-artifacts/${{ steps.resolve.outputs.env }}/${{ matrix.platform }}/**
          if-no-files-found: warn
          retention-days: 14

      # 本仓库不写 Draft Release（public 仓库不持有私有 monorepo 的写权限）。
      # 构建成功后由触发者在 loulin/gplus 执行写回，命令见本步骤摘要。
      - name: Publish handoff summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### macOS mobile build - $PLATFORM (no Release record written)"
            echo
            echo "- Application / profile: \`$APPLICATION\` / \`$PROFILE\`"
            echo "- Tag: \`$TAG\`"
            echo "- Build number: \`$BUILD_NUMBER\`"
            echo "- Android units: \`$ANDROID_UNITS\`"
            echo "- iOS units: \`$IOS_UNITS\`"
            echo "- Build outcome: \`${{ steps.build.outcome }}\`"
            echo
            echo "全部平台构建成功后，在 loulin/gplus 执行写回（触发者本人，用私有仓的 GITHUB_TOKEN）："
            echo
            echo '```'
            echo "gh workflow run record-mobile-runner-release.yml --repo loulin/gplus --ref master \\"
            echo "  -f tag=$TAG -f runner_run_id=${{ github.run_id }} -f profile=$PROFILE"
            echo '```'
            echo
            echo "本仓库不会写入 loulin/gplus 的发布记录；未执行写回时 Draft 里的单元保持未完成。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate mobile platform failure
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Remove GitHub token from source checkout
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d source/.git ]]; then
            git -C source config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git -C source submodule foreach --recursive \
              'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' \
              2>/dev/null || true
          fi
