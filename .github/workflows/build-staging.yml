name: Staging Windows Desktop Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch name or full 40-character commit SHA in loulin/gplus
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: staging-windows-desktop-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build win-x64 package
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      SOURCE_REF: ${{ inputs.source_ref }}
      GPLUS_DESKTOP_TARGET: win-x64
      GPLUS_DESKTOP_UPDATE_CHANNEL: staging
      GPLUS_DESKTOP_UPDATE_BASE_URL: https://assets.imedpower.com/apps/gplus-bot-desktop

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ secrets.GPLUS_SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.GPLUS_SOURCE_READER_PRIVATE_KEY }}
          owner: loulin
          repositories: gplus
          permission-contents: read

      - name: Checkout private source at requested ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: loulin/gplus
          ref: ${{ inputs.source_ref }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Validate packaging Python layout
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python.exe).Source
          if (-not $pythonPath -or -not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
            throw "GitHub Windows Python executable is unavailable: $pythonPath"
          }
          $pythonRoot = Split-Path -Parent $pythonPath
          $python3Path = Join-Path $pythonRoot 'python3.exe'
          if (Test-Path -LiteralPath $python3Path) {
            $python3Item = Get-Item -LiteralPath $python3Path
            if ($python3Item.PSIsContainer -or (($python3Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
              Remove-Item -LiteralPath $python3Path -Force -Recurse
            }
          }
          if (Test-Path -LiteralPath $python3Path) {
            throw "Packaging Python python3.exe could not be removed from the temporary runner: $python3Path"
          }
          "GPLUS_OFFLINE_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          Write-Host "Packaging Python: $pythonPath"
          & $pythonPath --version

      - name: Setup age encryption
        id: age
        shell: pwsh
        env:
          AGE_VERSION: '1.2.1'
          AGE_ARCHIVE_SHA256: 46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "age-v$($env:AGE_VERSION)-windows-amd64.zip"
          $archiveUrl = "https://github.com/FiloSottile/age/releases/download/v$($env:AGE_VERSION)/age-v$($env:AGE_VERSION)-windows-amd64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $archiveUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:AGE_ARCHIVE_SHA256) {
            throw "age archive SHA-256 mismatch: expected $($env:AGE_ARCHIVE_SHA256), got $actualHash"
          }
          $ageRoot = Join-Path $env:RUNNER_TEMP "age-v$($env:AGE_VERSION)-windows-amd64"
          if (Test-Path -LiteralPath $ageRoot) {
            Remove-Item -LiteralPath $ageRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $ageRoot -Force
          $agePath = Join-Path $ageRoot 'age/age.exe'
          if (-not (Test-Path -LiteralPath $agePath -PathType Leaf)) {
            throw "age executable is missing after extraction: $agePath"
          }
          & $agePath --version
          if ($LASTEXITCODE -ne 0) {
            throw "age executable failed its version check with status $LASTEXITCODE"
          }
          "GPLUS_AGE_PATH=$agePath" >> $env:GITHUB_ENV
          "GPLUS_AGE_VERSION=$($env:AGE_VERSION)" >> $env:GITHUB_ENV

      - name: Validate staging handoff recipient
        shell: pwsh
        env:
          AGE_RECIPIENT: ${{ vars.GPLUS_DESKTOP_ARTIFACT_AGE_RECIPIENT_STAGING }}
        run: |
          $recipient = [string]$env:AGE_RECIPIENT
          if ($recipient -notmatch '^age1[a-z0-9]+$') {
            throw 'Repository variable GPLUS_DESKTOP_ARTIFACT_AGE_RECIPIENT_STAGING must contain an age X25519 recipient before a build can run'
          }
          Write-Host 'Staging handoff recipient is configured; plaintext package upload remains disabled.'

      - name: Setup uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          enable-cache: false

      - name: Fetch locked Hermes release tag
        shell: pwsh
        working-directory: source
        run: |
          $lockPath = 'apps/gplus-bot-desktop/vendor/hermes-source-lock.json'
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          $hermesTag = [string]$lock.upstream.tag
          if ($hermesTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Hermes source lock has an invalid tag: $hermesTag"
          }
          $hermesPath = 'apps/gplus-bot-desktop/vendor/hermes-agent'
          git -C $hermesPath fetch --no-recurse-submodules origin "refs/tags/$hermesTag`:refs/tags/$hermesTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch locked Hermes tag: $hermesTag"
          }

      - name: Verify source identity and runner architecture
        id: source
        shell: pwsh
        run: |
          $sourceRef = $env:SOURCE_REF.Trim()
          if ([string]::IsNullOrWhiteSpace($sourceRef)) {
            throw 'source_ref must not be empty'
          }
          if ($sourceRef -match '[\r\n]' -or $sourceRef -match '\.\.' -or $sourceRef -notmatch '^[A-Za-z0-9._/-]+$') {
            if ($sourceRef -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'source_ref must be a branch-like ref or a full 40-character commit SHA'
            }
          }

          $sourceSha = (git -C source rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve source SHA: $sourceSha"
          }
          if ($sourceRef -match '^[0-9a-fA-F]{40}$' -and $sourceSha -ne $sourceRef.ToLowerInvariant()) {
            throw "Requested commit does not match checked out source: $sourceRef -> $sourceSha"
          }

          $nodeArch = (node -p 'process.arch').Trim()
          if ($nodeArch -ne 'x64') {
            throw "win-x64 package requires x64 Node, got $nodeArch"
          }
          $hermesPath = 'source/apps/gplus-bot-desktop/vendor/hermes-agent'
          $submoduleStatus = @(git -C source submodule status --recursive)
          if ($LASTEXITCODE -ne 0 -or $submoduleStatus.Count -eq 0 -or ($submoduleStatus | Where-Object { $_ -match '^[+\-U]' })) {
            throw 'Hermes submodule is not initialized at the expected commit'
          }
          $hermesSha = (git -C $hermesPath rev-parse HEAD).Trim().ToLowerInvariant()
          if ($hermesSha -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve Hermes SHA: $hermesSha"
          }

          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "hermes_sha=$hermesSha" >> $env:GITHUB_OUTPUT
          "node_arch=$nodeArch" >> $env:GITHUB_OUTPUT
          Write-Host "Source ref: $sourceRef"
          Write-Host "Source SHA: $sourceSha"
          Write-Host "Hermes SHA: $hermesSha"
          Write-Host "Node architecture: $nodeArch"

      - name: Install filtered workspace dependencies
        shell: pwsh
        working-directory: source
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --filter 'gplus-bot-desktop...' --recursive --frozen-lockfile --ignore-scripts
          corepack pnpm --filter '@gplus/bot-contracts' run build

      - name: Run Desktop JavaScript contract smoke
        shell: pwsh
        working-directory: source
        run: |
          node --test `
            apps/gplus-bot-desktop/tests/acceptance-evidence-audit.test.mjs `
            apps/gplus-bot-desktop/tests/gplus-desktop-release-version.test.mjs

      - name: Build unsigned Windows package
        shell: pwsh
        working-directory: source
        env:
          DESKTOP_WIN_SKIP_SIGN_AND_EDIT: '1'
          GPLUS_DESKTOP_UPDATE_CHANNEL: staging
          GPLUS_DESKTOP_UPDATE_BASE_URL: https://assets.imedpower.com/apps/gplus-bot-desktop
        run: |
          node apps/gplus-bot-desktop/scripts/run-desktop-release-target.mjs `
            win-x64 `
            --channel staging `
            --base-url https://assets.imedpower.com/apps/gplus-bot-desktop `
            --api-base-url https://gplus.staging.imedpower.com

      - name: Write sanitized build manifest
        shell: pwsh
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          HERMES_SHA: ${{ steps.source.outputs.hermes_sha }}
          NODE_ARCH: ${{ steps.source.outputs.node_arch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $packagePath = 'apps/gplus-bot-desktop/package.json'
          $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $releaseDir = 'apps/gplus-bot-desktop/.generated/gplus-bot-desktop-win-x64/apps/desktop/release'
          if (-not (Test-Path -LiteralPath $releaseDir -PathType Container)) {
            throw "Windows release directory is missing: $releaseDir"
          }
          $files = @(Get-ChildItem -LiteralPath $releaseDir -File | Sort-Object Name)
          if ($files.Count -eq 0) {
            throw 'Windows release directory contains no files'
          }
          $fileRecords = @($files | ForEach-Object {
            [ordered]@{
              name = $_.Name
              size = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $manifest = [ordered]@{
            schemaVersion = 1
            kind = 'gplus-bot-desktop-staging-windows-build'
            sourceRepository = 'loulin/gplus'
            sourceRef = $env:SOURCE_REF
            sourceSha = $env:SOURCE_SHA
            hermesSha = $env:HERMES_SHA
            channel = 'staging'
            target = 'win-x64'
            version = [string]$package.version
            buildNumber = [int]$package.buildNumber
            runner = 'windows-latest'
            nodeArchitecture = $env:NODE_ARCH
            workflowRunId = [int64]$env:RUN_ID
            workflowRunAttempt = [int]$env:RUN_ATTEMPT
            packageMode = 'unsigned-handoff'
            files = $fileRecords
          }
          $manifestPath = 'staging-build-manifest.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $summary = @(
            '### Staging Windows Desktop build',
            '',
            "- Source: ``$($env:SOURCE_SHA)`` ($($env:SOURCE_REF))",
            "- Hermes: ``$($env:HERMES_SHA)``",
            "- Version/build: ``$($package.version)`` / ``$($package.buildNumber)``",
            '- Target: ``win-x64``',
            '- Package mode: unsigned package; encrypted handoff follows',
            '',
            '| File | Bytes | SHA-256 |',
            '| --- | ---: | --- |'
          )
          foreach ($file in $fileRecords) {
            $summary += "| ``$($file.name)`` | $($file.size) | ``$($file.sha256)`` |"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Create encrypted Windows handoff
        shell: pwsh
        env:
          AGE_RECIPIENT: ${{ vars.GPLUS_DESKTOP_ARTIFACT_AGE_RECIPIENT_STAGING }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          HERMES_SHA: ${{ steps.source.outputs.hermes_sha }}
        run: |
          $sourceRoot = Join-Path $pwd.Path 'source'
          $targetRoot = Join-Path $sourceRoot 'apps/gplus-bot-desktop/.generated/gplus-bot-desktop-win-x64'
          $releaseDir = Join-Path $targetRoot 'apps/desktop/release'
          $buildManifestPath = Join-Path $sourceRoot 'staging-build-manifest.json'
          $packagePath = Join-Path $sourceRoot 'apps/gplus-bot-desktop/package.json'
          $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $scriptPath = Join-Path $pwd.Path 'scripts/package-windows-handoff.ps1'
          & $scriptPath `
            -SourceRoot $sourceRoot `
            -TargetRoot $targetRoot `
            -ReleaseDir $releaseDir `
            -BuildManifestPath $buildManifestPath `
            -OutputDirectory (Join-Path $pwd.Path 'handoff-output') `
            -AgePath $env:GPLUS_AGE_PATH `
            -Recipient $env:AGE_RECIPIENT `
            -AgeVersion $env:GPLUS_AGE_VERSION `
            -SourceRef $env:SOURCE_REF `
            -SourceSha $env:SOURCE_SHA `
            -HermesSha $env:HERMES_SHA `
            -Channel 'staging' `
            -Target 'win-x64' `
            -Version ([string]$package.version) `
            -BuildNumber ([int]$package.buildNumber) `
            -RunId ([long]$env:GITHUB_RUN_ID) `
            -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
          $handoffDirectory = Join-Path $pwd.Path 'handoff-output'
          $handoffFiles = @(Get-ChildItem -LiteralPath $handoffDirectory -Force -File | Sort-Object Name)
          $ciphertextFiles = @($handoffFiles | Where-Object { $_.Name.EndsWith('.age', [System.StringComparison]::OrdinalIgnoreCase) })
          $manifestFiles = @($handoffFiles | Where-Object { $_.Name.EndsWith('.ciphertext-manifest.json', [System.StringComparison]::OrdinalIgnoreCase) })
          if ($handoffFiles.Count -ne 2 -or $ciphertextFiles.Count -ne 1 -or $manifestFiles.Count -ne 1) {
            throw 'Handoff output must contain exactly one age ciphertext and one ciphertext manifest'
          }
          $ciphertext = $ciphertextFiles[0]
          $headerBytes = [byte[]]::new(64)
          $stream = [System.IO.File]::OpenRead($ciphertext.FullName)
          try {
            $read = $stream.Read($headerBytes, 0, $headerBytes.Length)
          } finally {
            $stream.Dispose()
          }
          $header = [System.Text.Encoding]::ASCII.GetString($headerBytes, 0, $read)
          if (-not $header.StartsWith('age-encryption.org/v1', [System.StringComparison]::Ordinal)) {
            throw "Ciphertext header validation failed: $($ciphertext.Name)"
          }
          $handoffFiles | ForEach-Object { Write-Host "Handoff output: $($_.Name) ($($_.Length) bytes)" }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            '',
            '### Encrypted Windows handoff',
            '',
            '- Plaintext release files were allow-list packaged and removed after encryption.',
            '- Download the handoff artifact below and decrypt it on the Windows signing machine.',
            "- Handoff files: $($handoffFiles.Name -join ', ')"
          )

      - name: Upload sanitized build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gplus-bot-desktop-staging-manifest-${{ github.run_id }}
          path: source/staging-build-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted Windows handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gplus-bot-desktop-staging-handoff-${{ github.run_id }}
          path: handoff-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove plaintext generated package
        if: always()
        shell: pwsh
        run: |
          $generatedRoot = Join-Path $pwd.Path 'source/apps/gplus-bot-desktop/.generated/gplus-bot-desktop-win-x64'
          if (Test-Path -LiteralPath $generatedRoot) {
            Remove-Item -LiteralPath $generatedRoot -Recurse -Force
          }
